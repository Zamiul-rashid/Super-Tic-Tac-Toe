# Build the image from this checkout. Most people want the published image
# instead: `docker compose up` from the repository root (see ../compose.yaml).
services:
  sttt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sttt:latest
    ports:
      - "8000:8000"
    environment:
      # Left unset, ONNX Runtime takes every core on the host.
      STTT_WEB_THREADS: "4"
      STTT_WEB_MAX_SESSIONS: "8"
    restart: unless-stopped
